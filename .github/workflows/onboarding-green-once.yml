name: Onboarding Green Migration (one-shot)

on:
  push:
    branches:
      - solarize/onboarding-science-v1

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout onboarding branch
        uses: actions/checkout@v5
        with:
          ref: solarize/onboarding-science-v1
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply deterministic Green/refactor changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve an explicitly saved legacy custom-font preference, but
          # never offer the old diagnosis-labelled choice to new users.
          onboarding_hook = Path('src/hooks/useOnboardingFlow.jsx')
          replace_once(
              onboarding_hook,
              "textStyle: ['standard', 'large', 'spaced'].includes(value.textStyle)",
              "textStyle: ['standard', 'large', 'spaced', 'dyslexic'].includes(value.textStyle)",
              'legacy preference preservation'
          )
          replace_once(
              onboarding_hook,
              "monthlyIncome: legacyQuickSetup.monthlyIncome ?? legacyQuickSetup.monthlyBudget ?? ''",
              "monthlyIncome: Object.prototype.hasOwnProperty.call(legacyQuickSetup, 'monthlyIncome') ? legacyQuickSetup.monthlyIncome : ''",
              'do not reinterpret legacy monthly budget as income'
          )

          flow = Path('src/onboarding/OnboardingFlow.jsx')
          replace_once(
              flow,
              "['standard', 'large', 'spaced'].includes(state.textStyle)",
              "['standard', 'large', 'spaced', 'dyslexic'].includes(state.textStyle)",
              'legacy text style remains a valid migrated state'
          )

          app = Path('src/App.jsx')
          replace_once(
              app,
              "const incomeInput = flowSelections?.quickSetup?.monthlyIncome ?? flowSelections?.quickSetup?.monthlyBudget ?? '';",
              "const incomeInput = flowSelections?.quickSetup?.monthlyIncome ?? '';",
              'seed only explicit income data'
          )

          # Replace only the two accessibility cards in Settings. The rest of
          # SettingsView remains byte-for-byte untouched.
          settings = Path('src/components/SettingsView.jsx')
          text = settings.read_text(encoding='utf-8')

          old_hooks = "    motionPreference,\n    reduceMotionEnabled,\n    setReduceMotionEnabled,\n    animationsEnabled,"
          new_hooks = "    motionPreference,\n    setMotionPreference,\n    animationsEnabled,"
          if text.count(old_hooks) != 1:
              raise SystemExit('Settings hook contract did not match expected source')
          text = text.replace(old_hooks, new_hooks, 1)

          old_grid = "          display: 'grid',\n          gap: theme.spacing.md,\n          marginTop: theme.spacing.md\n"
          new_grid = "          display: 'grid',\n          gap: theme.spacing.md,\n          marginTop: theme.spacing.md,\n          minWidth: 0,\n          maxWidth: '100%'\n"
          if text.count(old_grid) != 1:
              raise SystemExit('Settings root grid did not match expected source')
          text = text.replace(old_grid, new_grid, 1)

          def outer_card_start(source: str, marker: str) -> int:
              marker_index = source.index(marker)
              start = source.rfind("        <div\n          style={{\n            border:", 0, marker_index)
              if start < 0:
                  raise SystemExit(f'Unable to find card start for {marker}')
              return start

          reading_marker = "{t('settingsFontLabel') || 'Reading style'}"
          motion_marker = "{t('settingsMotionLabel') || 'Motion preference'}"
          reading_start = outer_card_start(text, reading_marker)
          motion_start = outer_card_start(text, motion_marker)

          reading_block = """        <div
          style={{
            border: `1px solid ${theme.colors.border}`,
            borderRadius: theme.shape.radiusMd,
            padding: theme.spacing.md,
            background: theme.colors.surface,
            minWidth: 0,
            maxWidth: '100%',
            boxSizing: 'border-box'
          }}
        >
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: theme.spacing.md, flexWrap: 'wrap', minWidth: 0 }}>
            <div style={{ minWidth: 0, flex: '1 1 220px' }}>
              <p style={{ margin: 0, fontWeight: 600 }}>{t('settingsFontLabel') || 'Reading style'}</p>
              <small style={{ color: theme.colors.muted }}>
                {t('onboarding.accessibility.textStyleHelper')}
              </small>
              <p style={{ margin: '0.25rem 0', color: theme.colors.text }}>
                {t('settingsCurrentValue', {
                  value:
                    textStylePreference === 'dyslexic'
                      ? t('onboarding.accessibility.legacyTextStyle')
                      : textStylePreference === 'large'
                        ? t('onboarding.accessibility.largeText')
                        : textStylePreference === 'spaced'
                          ? t('onboarding.accessibility.spacedText')
                          : t('onboarding.accessibility.standardText')
                })}
              </p>
            </div>
            <select
              value={textStylePreference || 'standard'}
              onChange={(e) => setTextStylePreference(e.target.value)}
              aria-label={t('settingsFontLabel') || 'Reading style'}
              style={{
                padding: `${theme.spacing.sm}px ${theme.spacing.md}px`,
                borderRadius: theme.shape.radiusSm,
                border: `1px solid ${theme.colors.border}`,
                background: theme.colors.background,
                color: theme.colors.text,
                minWidth: 0,
                maxWidth: '100%',
                flex: '1 1 180px'
              }}
            >
              {textStylePreference === 'dyslexic' && (
                <option value="dyslexic">{t('onboarding.accessibility.legacyTextStyle')}</option>
              )}
              <option value="standard">{t('onboarding.accessibility.standardText')}</option>
              <option value="large">{t('onboarding.accessibility.largeText')}</option>
              <option value="spaced">{t('onboarding.accessibility.spacedText')}</option>
            </select>
          </div>
        </div>

"""
          text = text[:reading_start] + reading_block + text[motion_start:]

          motion_start = outer_card_start(text, motion_marker)
          tts_marker = "{t('settingsTtsLabel') || t('onboarding.accessibility.tts')}"
          tts_start = outer_card_start(text, tts_marker)

          motion_block = """        <div
          style={{
            border: `1px solid ${theme.colors.border}`,
            borderRadius: theme.shape.radiusMd,
            padding: theme.spacing.md,
            background: theme.colors.surface,
            minWidth: 0,
            maxWidth: '100%',
            boxSizing: 'border-box'
          }}
        >
          <div style={{ display: 'grid', gap: theme.spacing.sm, minWidth: 0 }}>
            <div>
              <p style={{ margin: 0, fontWeight: 600 }}>{t('settingsMotionLabel') || 'Motion preference'}</p>
              <small id="motion-helper" style={{ color: theme.colors.muted }}>
                {t('onboarding.accessibility.motionHelper')}
              </small>
            </div>
            <select
              value={motionPreference || 'system'}
              onChange={(e) => setMotionPreference(e.target.value)}
              aria-label={t('settingsMotionLabel') || 'Motion preference'}
              aria-describedby="motion-helper"
              style={{
                width: '100%',
                minWidth: 0,
                maxWidth: '100%',
                padding: `${theme.spacing.sm}px ${theme.spacing.md}px`,
                borderRadius: theme.shape.radiusSm,
                border: `1px solid ${theme.colors.border}`,
                background: theme.colors.background,
                color: theme.colors.text
              }}
            >
              <option value="system">{t('onboarding.accessibility.motionSystem')}</option>
              <option value="reduced">{t('onboarding.accessibility.reducedMotion')}</option>
              <option value="standard">{t('onboarding.accessibility.standardMotion')}</option>
            </select>
            <small style={{ color: theme.colors.muted }}>
              {t('settingsCurrentValue', {
                value:
                  motionPreference === 'reduced'
                    ? t('onboarding.accessibility.reducedMotion')
                    : motionPreference === 'standard'
                      ? t('onboarding.accessibility.standardMotion')
                      : t('onboarding.accessibility.motionSystem')
              })}
            </small>
            <label style={{ display: 'flex', alignItems: 'center', gap: theme.spacing.sm, minWidth: 0 }}>
              <input
                type="checkbox"
                checked={animationsEnabled}
                onChange={(e) => setAnimationsEnabled(e.target.checked)}
                aria-label={t('settingsAnimationLabel') || 'Allow animations'}
                aria-describedby="animation-helper"
                style={{ width: 20, height: 20 }}
              />
              <span>
                {animationsEnabled
                  ? t('settingsAnimationOn') || 'Animations enabled'
                  : t('settingsAnimationOff') || 'Animations limited'}
              </span>
            </label>
            <small id="animation-helper" style={{ color: theme.colors.muted }}>
              {t('settingsAnimationHelper') || 'Disable non-essential animations to keep the interface calm.'}
            </small>
          </div>
        </div>

"""
          text = text[:motion_start] + motion_block + text[tts_start:]
          settings.write_text(text, encoding='utf-8')

          # Keep the evidence ledger synchronized with the final bundle.
          evidence = Path('docs/ONBOARDING_EVIDENCE.md')
          evidence_text = evidence.read_text(encoding='utf-8')
          evidence_text = evidence_text.replace(
              '- **Focus-friendly:** larger text + reduced motion + non-essential animations off.',
              '- **Focus-friendly:** more text spacing + reduced motion + non-essential animations off.'
          )
          evidence_text = evidence_text.replace(
              'Goal intentions alone do not reliably produce action. Implementation-intention research supports specifying when/where/how action will occur, and behavioral-activation literature supports activity scheduling and graded tasks. GYLIO\'s onboarding uses a much lighter intervention: optionally create one concrete next task. It does **not** claim that typing a task guarantees completion.',
              'Goal setting has a small positive average effect across randomized behavior-change studies, while effects vary by context. Progress-monitoring interventions also improve goal attainment on average. GYLIO uses a much lighter product setup: optionally create one concrete next task. It does **not** claim that typing a task guarantees completion.'
          )
          evidence_text = evidence_text.replace(
              '- Gollwitzer/implementation-intention review summarizing 94 studies and d≈0.65: https://pmc.ncbi.nlm.nih.gov/articles/PMC4500900/\n- Toli et al. meta-analysis in clinical/analogue samples: https://pubmed.ncbi.nlm.nih.gov/25965276/\n- Cuijpers et al. 2026 behavioral activation systematic review/meta-analysis: https://pubmed.ncbi.nlm.nih.gov/42492146/',
              '- Epton et al., goal-setting systematic review/meta-analysis (141 papers; 384 effects; N=16,523; d=0.34): https://pubmed.ncbi.nlm.nih.gov/29189034/\n- Harkin et al., experimental progress-monitoring meta-analysis (138 studies; N=19,951; goal attainment d=0.40): https://pubmed.ncbi.nlm.nih.gov/26479070/'
          )
          evidence.write_text(evidence_text, encoding='utf-8')

          # Add explicit regression evidence for the two subtle migration rules.
          unit = Path('src/onboarding/onboardingFlow.test.ts')
          unit_text = unit.read_text(encoding='utf-8')
          marker = "    expect(Object.keys(SUPPORT_PROFILES)).not.toEqual(expect.arrayContaining(['adhd', 'autism', 'anxiety', 'dyslexia']));\n"
          if marker not in unit_text:
              raise SystemExit('Unit-test insertion marker missing')
          unit_text = unit_text.replace(
              marker,
              marker + "    expect(SUPPORT_PROFILES.focus.textStyle).toBe('spaced');\n"
          )
          unit.write_text(unit_text, encoding='utf-8')

          migration = Path('e2e/onboarding-migration.spec.ts')
          migration.write_text("""import { expect, test } from '@playwright/test';

test('legacy onboarding data is migrated without turning an old budget amount into income', async ({ page }) => {
  await page.goto('/gylio/onboarding');
  await page.evaluate(() => {
    localStorage.setItem('gylio_lang', 'en');
    localStorage.setItem('onboardingFlowState', JSON.stringify({
      schemaVersion: 1,
      currentStep: 2,
      isOnboardingComplete: false,
      selections: {
        accessibility: {
          textStyle: 'standard',
          contrast: 'balanced',
          motion: 'standard',
          animations: true,
          tts: false
        },
        neurodivergence: { preset: 'skip', supports: [] },
        quickSetup: { starterGoal: 'Keep this task', monthlyBudget: '9999' },
        tour: { acknowledged: false, reminders: true }
      }
    }));
  });
  await page.reload({ waitUntil: 'networkidle' });

  await expect(page.getByRole('heading', { name: /start with something useful/i })).toBeVisible();
  await expect(page.getByLabel(/first task.*optional/i)).toHaveValue('Keep this task');
  await expect(page.getByLabel(/monthly take-home income.*optional/i)).toHaveValue('');
});

 test('legacy custom-font preference is preserved without re-advertising a diagnosis label', async ({ page }) => {
  await page.goto('/gylio/onboarding');
  await page.evaluate(() => {
    localStorage.setItem('gylio_lang', 'en');
    localStorage.setItem('onboardingFlowState', JSON.stringify({
      schemaVersion: 1,
      currentStep: 0,
      isOnboardingComplete: false,
      selections: {
        accessibility: {
          textStyle: 'dyslexic',
          contrast: 'balanced',
          motion: 'standard',
          animations: true,
          tts: false
        },
        neurodivergence: { preset: 'skip', supports: [] },
        quickSetup: { starterGoal: '', monthlyBudget: '' },
        tour: { acknowledged: false, reminders: false }
      }
    }));
  });
  await page.reload({ waitUntil: 'networkidle' });

  await expect(page.getByText(/custom font preference from an earlier gylio version/i)).toBeVisible();
  await expect(page.getByText(/opendyslexic/i)).toHaveCount(0);
  await expect(page.getByRole('button', { name: /next/i })).toBeEnabled();
});
""", encoding='utf-8')

          # Remove the previous one-time Settings writer from permanent CI.
          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          start = ci_text.find('  onboarding-settings-refactor:')
          end = ci_text.find('  quality:', start)
          if start < 0 or end < 0:
              raise SystemExit('Temporary Settings CI job markers missing')
          ci.write_text(ci_text[:start] + ci_text[end:], encoding='utf-8')
          PY

          rm -f scripts/.onboarding-settings-refactor-trigger

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix server

      - name: Static and unit verification
        run: |
          npm run lint
          npm run typecheck
          npm run check:i18n
          npm test
          npm run build

      - name: Browser verifier for onboarding behavior
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/onboarding-science.spec.ts e2e/onboarding-migration.spec.ts

      - name: Remove this one-shot workflow after successful verification
        run: rm -f .github/workflows/onboarding-green-once.yml

      - name: Commit only verified source and cleanup
        shell: bash
        run: |
          git diff --check
          git status --short
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Expected verified onboarding changes but working tree is clean.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align onboarding with evidence and user preferences'
          git push origin HEAD:solarize/onboarding-science-v1
