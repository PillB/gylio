name: Live production validation

on:
  push:
    branches:
      - validation/live-prod-2026-08-23
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: live-production-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_RELEASE_SHA: f70dde1cfa9c2fda37741282ccb916df7445740d

jobs:
  release-ready:
    name: Exact deployed release gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require target SHA to remain current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          echo "Current main:  ${main_sha}"
          echo "Target release: ${TARGET_RELEASE_SHA}"
          test "$main_sha" = "$TARGET_RELEASE_SHA"

      - name: Wait for exact Pages live validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_RELEASE_SHA}/status" \
              --jq '[.statuses[] | select(.context == "pages-live")][0].state // "missing"')"
            echo "pages-live=${state} (attempt ${attempt}/30)"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Exact Pages deployment has a failing live status."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for pages-live success on ${TARGET_RELEASE_SHA}."
          exit 1

  python-live:
    name: Python HTTP/content validation
    needs: release-ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate public HTTP artifact and content
        run: python scripts/live_site_check.py --base https://pillb.github.io/gylio/ --report artifacts/live-python-report.json

      - name: Upload Python validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-python-validation
          path: artifacts/live-python-report.json
          if-no-files-found: error
          retention-days: 14

  playwright-live:
    name: Playwright live user-flow validation
    needs: release-ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: https://pillb.github.io/gylio/
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reproducible dependency install
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live production user flows
        run: npx playwright test e2e/live-site.spec.ts --project=chromium

      - name: Upload Playwright live evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-playwright-validation
          path: |
            playwright-report/
            test-results/
            e2e/live-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  publish-status:
    name: Publish auditable validation status
    if: always()
    needs: [release-ready, python-live, playwright-live]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish commit status with workflow link
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ needs.release-ready.result }}
          PYTHON_RESULT: ${{ needs.python-live.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright-live.result }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          state=success
          if [ "$RELEASE_RESULT" != "success" ] || [ "$PYTHON_RESULT" != "success" ] || [ "$PLAYWRIGHT_RESULT" != "success" ]; then
            state=failure
          fi
          description="Release=$RELEASE_RESULT; Python=$PYTHON_RESULT; Playwright=$PLAYWRIGHT_RESULT"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python - "$state" "$description" "$target_url" <<'PY' > status.json
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "live-production-validation",
              "description": sys.argv[2][:140],
              "target_url": sys.argv[3],
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            --data-binary @status.json
