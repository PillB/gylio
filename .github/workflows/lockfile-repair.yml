name: Lockfile Repair Evidence

on:
  push:
    branches: ["solarize/prod-readiness-v6"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify regenerated lockfile supports clean install
        run: npm ci --ignore-scripts

      - name: Show dependency-manifest diff
        run: git diff -- package-lock.json

      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          retention-days: 2

      - name: Commit verified repaired lockfile on Solarize branch
        if: github.event_name == 'push' && github.ref_name == 'solarize/prod-readiness-v6'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile"
          git push origin HEAD:solarize/prod-readiness-v6
