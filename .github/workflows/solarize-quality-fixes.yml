name: Solarize Quality Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'solarize/prod-readiness-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install verified dependencies
        run: npm ci --ignore-scripts

      - name: Apply targeted quality repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected at most one match, got {count}')
              return text.replace(old, new, 1)

          # Routines: integrate the read-only XYFlow sequence and remove the
          # unused import caught by lint. Keep the checklist as semantic truth.
          p = Path('src/features/routines/components/RoutinesView.tsx')
          text = p.read_text()
          text = text.replace(
              "import React, { useCallback, useState } from 'react';",
              "import React, { useState } from 'react';",
          )
          if "import RoutineFlowDiagram from './RoutineFlowDiagram';" not in text:
              text = replace_once(
                  text,
                  "import { StreakDots } from './StreakDots';",
                  "import { StreakDots } from './StreakDots';\nimport RoutineFlowDiagram from './RoutineFlowDiagram';",
                  'routine flow import',
              )
          if '<RoutineFlowDiagram' not in text:
              text = replace_once(
                  text,
                  "                    {/* 21-day streak dots */}",
                  """                    <RoutineFlowDiagram
                      routineTitle={routine.title}
                      steps={routine.steps}
                      anchorHabit={routine.anchorHabit}
                      theme={theme}
                    />

                    {/* 21-day streak dots */}""",
                  'routine flow placement',
              )
          text = text.replace('      {/* Research-backed routine templates */}', '      {/* Optional routine templates */}')
          text = text.replace("t('routines.tpl.showGallery', 'Browse research-backed protocols')", "t('routines.tpl.showGallery', 'Browse routine templates')")
          text = text.replace("t('routines.tpl.hideGallery', 'Hide protocols')", "t('routines.tpl.hideGallery', 'Hide templates')")
          text = text.replace("t('routines.anchorHelper', 'Anchoring to an existing habit makes this much more likely to stick.')", "t('routines.anchorHelper', 'Link this routine to an existing habit if that cue is useful to you.')")
          text = text.replace("t('routines.emptyBody', 'A single consistent routine — even 10 minutes — is more valuable than any app, book, or plan. Start with one thing you want to do every day.')", "t('routines.emptyBody', 'Start with one small routine you want to make easier to repeat. You can adjust it at any time.')")
          text = text.replace("t('routines.tpl.showGallery', '🔬 Browse research-backed protocols')", "t('routines.tpl.showGallery', 'Browse routine templates')")
          p.write_text(text)

          # Tasks: remove a disconnected legacy Pomodoro implementation while
          # retaining the current per-task TaskTimerInline path.
          p = Path('src/features/tasks/components/TaskList.tsx')
          text = p.read_text()
          text = text.replace("import usePomodoroTimer from '../hooks/usePomodoroTimer';\n", '')
          text = text.replace("import PomodoroTimer from './PomodoroTimer';\n", '')
          text = text.replace('    startPomodoro,\n', '')
          text = text.replace('  const pomodoro = usePomodoroTimer();\n', '')
          text = text.replace(
              '  }, [pendingLogEntry]); // eslint-disable-line react-hooks/exhaustive-deps',
              '  }, [appendTaskTimeLog, clearPendingEntry, pendingLogEntry, refreshTasks]);',
          )
          text = text.replace(
              '  const [selectedDuration, setSelectedDuration] = useState<number>(25);',
              '  const [selectedDuration] = useState<number>(25);',
          )
          text = text.replace('  const hiddenCount = filteredTasks.length - FOCUS_MODE_LIMIT;\n\n', '')
          text = replace_once(
              text,
              """  const handleStartFocus = useCallback(() => {
    pomodoro.start(selectedDuration * 60);
    startPomodoro({ durationMinutes: selectedDuration });
  }, [pomodoro, selectedDuration, startPomodoro]);

  const handlePomodoroComplete = useCallback(() => {
    // XP is awarded via startPomodoro (notification) — nothing extra needed here
  }, []);

""",
              '',
              'legacy pomodoro callbacks',
          )
          text = replace_once(
              text,
              """  const focusButtonStyle: React.CSSProperties = useMemo(
    () => ({
      minHeight: '44px',
      minWidth: '72px',
      padding: '0.75rem 1rem',
      borderRadius: theme.shape.radiusMd,
      border: `1px solid ${theme.colors.border}`,
      backgroundColor: theme.colors.surface,
      cursor: 'pointer',
      fontSize: '1rem',
      color: theme.colors.text,
      fontFamily: theme.typography.body.family,
    }),
    [theme]
  );

""",
              '',
              'unused focus button style',
          )
          text = text.replace('      {/* Research-backed task templates */}', '      {/* Optional task templates */}')
          text = text.replace("t('tasks.tpl.showGallery', 'Quick-start from proven tasks')", "t('tasks.tpl.showGallery', 'Browse quick-start tasks')")
          text = text.replace('              Research shows fewer visible tasks = more completed.', '              Fewer visible tasks can reduce visual load.')
          text = text.replace("t('tasks.intentionHelper', 'Adding when/where doubles follow-through.')", "t('tasks.intentionHelper', 'A specific when/where cue can make the next action clearer.')")
          p.write_text(text)

          # Replace an explicit-any style helper with the existing theme type.
          p = Path('src/features/tasks/components/TaskTimerInline.tsx')
          text = p.read_text()
          if "import type { ThemeTokens } from '../../../core/themes';" not in text:
              text = text.replace(
                  "import { useTaskTimer } from '../../../core/context/TaskTimerContext';",
                  "import { useTaskTimer } from '../../../core/context/TaskTimerContext';\nimport type { ThemeTokens } from '../../../core/themes';",
              )
          text = text.replace('function btnStyle(theme: any, borderColor: string, filled: boolean): React.CSSProperties {', 'function btnStyle(theme: ThemeTokens, borderColor: string, filled: boolean): React.CSSProperties {')
          p.write_text(text)

          # Remove a stale test import; the behavior is still asserted below.
          p = Path('src/features/tasks/utils/taskForm.test.ts')
          text = p.read_text().replace('  MIN_SUBTASKS,\n', '')
          p.write_text(text)
          PY

          git diff --check

      - name: Prove feature lint is green
        run: npm run lint

      - name: Commit verified repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Quality repairs already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/routines/components/RoutinesView.tsx src/features/tasks/components/TaskList.tsx src/features/tasks/components/TaskTimerInline.tsx src/features/tasks/utils/taskForm.test.ts
          git commit -m "fix: resolve Solarize lint and routine integration gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
