name: Deploy GitHub Pages

on:
  # Deploy only after the CI workflow has completed on main. The deploy job
  # below also checks that CI concluded successfully before any Pages artifact
  # is built or published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Keep an explicit operator-controlled path for recovery/testing.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          # For automatic deployments, build the exact SHA that the completed
          # CI run verified instead of whichever commit happens to be latest.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from verified lockfile
        run: npm ci --ignore-scripts

      - name: Build for project Pages path
        env:
          VITE_BASE_PATH: /gylio/
        run: npm run build

      - name: Add SPA fallback for BrowserRouter deep links
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate live Pages artifact
        id: live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          origin="$(printf '%s' "$base" | sed -E 's#(https?://[^/]+).*#\1#')"
          root_file="$(mktemp)"
          guide_file="$(mktemp)"
          asset_file="$(mktemp)"
          trap 'rm -f "$root_file" "$guide_file" "$asset_file"' EXIT

          # Pages/CDN propagation can lag the deploy API briefly. Retry the
          # exact public artifact. Validate only facts that exist in static
          # HTML here; React-rendered copy belongs in Playwright, not grep.
          success=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
                "${base}?sha=${VERIFIED_SHA}" -o "$root_file" \
              && curl --fail --silent --show-error --location \
                "${base}deployment-guide.html?sha=${VERIFIED_SHA}" -o "$guide_file" \
              && grep -q '<div id="root"></div>' "$root_file" \
              && grep -q 'gylio-guide-validated' "$guide_file" \
              && grep -q 'Shipping mobile containment gate' "$guide_file"; then

              # Vite rewrites the module entry to a hashed asset. Resolve and
              # download that emitted JavaScript so the smoke test proves the
              # deployed shell points at a real compiled application bundle.
              script_src="$(grep -oE 'src="[^"]*assets/[^"]+\.js"' "$root_file" | head -n 1 | cut -d'"' -f2 || true)"
              asset_url=""
              if [ -n "$script_src" ]; then
                case "$script_src" in
                  http://*|https://*) asset_url="$script_src" ;;
                  /*) asset_url="${origin}${script_src}" ;;
                  *) asset_url="${base}${script_src#./}" ;;
                esac
              fi

              if [ -n "$asset_url" ] \
                && curl --fail --silent --show-error --location \
                  "${asset_url}" -o "$asset_file" \
                && [ -s "$asset_file" ]; then
                success=1
                break
              fi
            fi
            echo "Live Pages artifact not propagated yet (attempt ${attempt}/12)."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Live Pages validation failed after propagation retries."
            exit 1
          fi

          echo "Live root: ${base}"
          echo "Live app asset: ${asset_url}"
          echo "Live guide: ${base}deployment-guide.html"
          echo "Validated deployed SHA: ${VERIFIED_SHA}"

      - name: Publish live deployment success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -f state=success \
            -f context=pages-live \
            -f description='GitHub Pages live smoke validation passed' \
            -f target_url="${PAGE_URL}"

      - name: Publish live deployment failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -f state=failure \
            -f context=pages-live \
            -f description='GitHub Pages live smoke validation failed'
