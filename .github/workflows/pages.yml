name: Deploy GitHub Pages

on:
  # Deploy only after the CI workflow has completed on main. The deploy job
  # below also checks that CI concluded successfully before any Pages artifact
  # is built or published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Keep an explicit operator-controlled path for recovery/testing.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          # For automatic deployments, build the exact SHA that the completed
          # CI run verified instead of whichever commit happens to be latest.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from verified lockfile
        run: npm ci --ignore-scripts

      - name: Build for project Pages path
        env:
          VITE_BASE_PATH: /gylio/
        run: npm run build

      - name: Add SPA fallback for BrowserRouter deep links
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
