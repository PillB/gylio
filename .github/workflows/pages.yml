name: Deploy GitHub Pages

on:
  # Deploy only after the CI workflow has completed on main. The deploy job
  # below also checks that CI concluded successfully before any Pages artifact
  # is built or published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Keep an explicit operator-controlled path for recovery/testing.
  workflow_dispatch:

# A deploy that has started is allowed to finish. Cancelling it half way can
# leave Pages serving a partial publish; a newer run simply waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For automatic deployments, build the exact SHA that the completed
          # CI run verified instead of whichever commit happens to be latest.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from verified lockfile
        run: npm ci --ignore-scripts

      - name: Build for project Pages path
        env:
          VITE_BASE_PATH: /gylio/
        run: npm run build

      - name: Add SPA fallback for BrowserRouter deep links
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # The live verifier is versioned and tested alongside the exact deployed source.
      - name: Checkout verified smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Validate live Pages artifact
        id: live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          origin="$(printf '%s' "$base" | sed -E 's#(https?://[^/]+).*#\1#')"
          root_file="$(mktemp)"
          asset_file="$(mktemp)"
          trap 'rm -f "$root_file" "$asset_file"' EXIT

          # Report which check failed on each retry. Do not treat every failure
          # as propagation lag; a missing module script is a different defect.
          parser_error="$(mktemp)"
          trap 'rm -f "$root_file" "$asset_file" "$parser_error"' EXIT
          success=0
          asset_url=""
          for attempt in $(seq 1 12); do
            root_status="$(curl --silent --show-error --location --output "$root_file" --write-out '%{http_code}' "${base}?sha=${VERIFIED_SHA}")" || root_status="curl-error"
            reason="root HTTP ${root_status}"
            if [ "$root_status" = "200" ]; then
              if grep -q '<div id="root"></div>' "$root_file"; then
                if asset_url="$(node scripts/pages-live-asset.mjs "$root_file" "$base" 2>"$parser_error")"; then
                  asset_status="$(curl --silent --show-error --location --output "$asset_file" --write-out '%{http_code}' "$asset_url")" || asset_status="curl-error"
                  reason="asset HTTP ${asset_status}; bytes $(wc -c < "$asset_file")"
                  if [ "$asset_status" = "200" ] && [ -s "$asset_file" ]; then
                    success=1
                    break
                  fi
                else
                  reason="module parser: $(cat "$parser_error")"
                fi
              else
                reason="root marker missing (HTTP 200; bytes $(wc -c < "$root_file"))"
              fi
            fi
            echo "Live Pages attempt ${attempt}/12: ${reason}"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Live Pages validation failed after retries; see per-attempt diagnosis above."
            exit 1
          fi

          # The internal deployment guide is not part of the public site any more; fail if it comes back.
          guide_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location \
            "${base}deployment-guide.html?sha=${VERIFIED_SHA}")"
          if [ "$guide_status" != "404" ]; then
            echo "The internal deployment guide is published again (HTTP ${guide_status})."
            exit 1
          fi

          echo "Live root: ${base}"
          echo "Live app asset: ${asset_url}"
          echo "Validated deployed SHA: ${VERIFIED_SHA}"

      - name: Publish live deployment success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -f state=success \
            -f context=pages-live \
            -f description='GitHub Pages live smoke validation passed' \
            -f target_url="${PAGE_URL}"

      - name: Publish live deployment failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -f state=failure \
            -f context=pages-live \
            -f description='GitHub Pages live smoke validation failed'
