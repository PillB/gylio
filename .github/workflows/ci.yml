name: CI

on:
  push:
    branches: [main, "solarize/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint feature code
        run: npm run lint

      - name: Typecheck task domain
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser audit
        run: npx playwright test

      - name: Upload Playwright audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
