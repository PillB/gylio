name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reproducible dependency install
        run: npm ci --ignore-scripts

      - name: Lint feature code
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck task domain
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Production localization integrity
        id: i18n
        continue-on-error: true
        run: node scripts/check-i18n.mjs

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm test

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Server runtime and syntax checks
        id: server
        continue-on-error: true
        run: |
          node --check server/server.js
          node --check server/repositories/entityRepository.js
          node --check server/routes/billing.js
          node --check server/routes/ai.js

          NODE_ENV=production MONGODB_URI='mongodb://unused.invalid/gylio' node - <<'NODE'
          const runtime = require('./server/server.js');
          if (!runtime.app || typeof runtime.initializePersistence !== 'function' || typeof runtime.startServer !== 'function') {
            throw new Error('Server runtime exports are incomplete');
          }
          console.log('Server production module graph loaded successfully.');
          NODE

          NODE_ENV=production node - <<'NODE'
          const { initializePersistence } = require('./server/server.js');
          initializePersistence()
            .then(() => {
              throw new Error('Production persistence unexpectedly initialized without MONGODB_URI');
            })
            .catch((error) => {
              if (!String(error?.message || error).includes('MONGODB_URI is required in production')) {
                throw error;
              }
              console.log('Production persistence fails closed without MongoDB.');
            });
          NODE

      - name: Aggregate quality gates
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          I18N: ${{ steps.i18n.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER: ${{ steps.server.outcome }}
        run: |
          printf 'lint=%s\ntypecheck=%s\ni18n=%s\nunit=%s\nbuild=%s\nserver=%s\n' \
            "$LINT" "$TYPECHECK" "$I18N" "$UNIT" "$BUILD" "$SERVER"
          for result in "$LINT" "$TYPECHECK" "$I18N" "$UNIT" "$BUILD" "$SERVER"; do
            if [ "$result" != "success" ]; then
              echo "One or more quality gates failed. Review the named step logs above."
              exit 1
            fi
          done

  browser:
    name: Browser and layout audit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser audit
        run: npx playwright test

      - name: Upload Playwright audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-audit
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency security report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install full repository lockfile graph
        run: npm ci --ignore-scripts

      - name: Capture full repository production-labelled audit
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Generate isolated API lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix server

      - name: Reproducible isolated API install
        run: npm ci --ignore-scripts --prefix server

      - name: Smoke-test isolated production API graph
        run: |
          cd server
          NODE_ENV=production MONGODB_URI='mongodb://unused.invalid/gylio' node - <<'NODE'
          const runtime = require('./server.js');
          if (!runtime.app || typeof runtime.initializePersistence !== 'function') {
            throw new Error('Isolated API graph failed to load');
          }
          console.log('Isolated Hostinger API dependency graph loads successfully.');
          NODE

      - name: Capture isolated API dependency audit
        run: npm audit --omit=dev --prefix server --json > server/npm-audit-production.json || true

      - name: Summarize dependency audits
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [label, path] of [
            ['full repository', 'npm-audit-production.json'],
            ['isolated API', 'server/npm-audit-production.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(`${label} vulnerabilities:`, report.metadata?.vulnerabilities ?? {});
          }
          NODE

      - name: Upload dependency evidence and API lockfile candidate
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audits
          path: |
            npm-audit-production.json
            server/npm-audit-production.json
            server/package.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 14

  sync-api-lockfile:
    name: One-time verified API lockfile sync
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'solarize/prod-readiness-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate and verify API lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --prefix server
          npm ci --ignore-scripts --prefix server
          npm audit --omit=dev --audit-level=high --prefix server

      - name: Commit only the verified API lockfile
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "API lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git diff --cached --name-only | grep -qx 'server/package-lock.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "build: lock production API dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
