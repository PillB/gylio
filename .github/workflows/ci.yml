name: CI

on:
  push:
    branches: [main, "solarize/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile repair verifier proves this exact clean-install mode from a
      # fresh checkout. Lifecycle scripts are not required for the Vite/unit/
      # Playwright gates below, and suppressing them also reduces supply-chain
      # exposure in CI. Native-runtime smoke tests belong in a dedicated server
      # job where their install scripts can be intentionally enabled.
      - name: Install dependencies from verified lockfile
        run: npm ci --ignore-scripts

      - name: Lint feature code
        run: npm run lint

      - name: Typecheck task domain
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Server syntax check
        run: |
          node --check server/server.js
          node --check server/repositories/entityRepository.js
          node --check server/routes/billing.js
          node --check server/routes/ai.js

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser audit
        run: npx playwright test

      - name: Upload Playwright audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
