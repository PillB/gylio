name: One-time root dependency prune

on:
  push:
    branches: [solarize/prod-readiness-v6]

permissions:
  contents: write

concurrency:
  group: one-time-root-dependency-prune
  cancel-in-progress: true

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          ref: solarize/prod-readiness-v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reduce root workspace to web/build dependencies
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          const remove = [
            'bcryptjs',
            'cors',
            'expo',
            'expo-av',
            'expo-notifications',
            'expo-router',
            'expo-speech',
            'expo-sqlite',
            'express',
            'express-rate-limit',
            'jsonwebtoken',
            'jwks-rsa',
            'mongodb',
            'mongoose',
            'sqlite3'
          ];
          for (const name of remove) delete pkg.dependencies[name];

          if (pkg.dependencies['@testing-library/dom']) {
            pkg.devDependencies['@testing-library/dom'] = pkg.dependencies['@testing-library/dom'];
            delete pkg.dependencies['@testing-library/dom'];
          }

          pkg.scripts.start = 'npm --prefix server start';
          pkg.scripts['install:api'] = 'npm ci --ignore-scripts --prefix server';

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Prove reproducible web workspace install
        run: npm ci --ignore-scripts

      - name: Verify web workspace
        run: |
          npm run lint
          npm run typecheck
          npm run check:i18n
          npm test
          npm run build

      - name: Verify isolated production API remains clean
        run: |
          npm ci --ignore-scripts --prefix server
          npm audit --omit=dev --audit-level=high --prefix server
          cd server
          NODE_ENV=production MONGODB_URI='mongodb://unused.invalid/gylio' node - <<'NODE'
          const runtime = require('./server.js');
          if (!runtime.app || typeof runtime.initializePersistence !== 'function') {
            throw new Error('Production API graph did not load');
          }
          NODE

      - name: Report remaining root advisory inventory
        run: npm audit --omit=dev || true

      - name: Commit only package manifest and lockfile
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf 'package-lock.json\npackage.json\n' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          if git diff --cached --quiet; then
            echo 'Root dependencies already pruned.'
            exit 0
          fi
          git commit -m "build: prune non-shipping root dependencies"
          git push origin HEAD:solarize/prod-readiness-v6
