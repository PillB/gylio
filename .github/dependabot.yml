version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      non-major-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major version updates need explicit compatibility work. Dependabot
    # security updates are not disabled by this version-update rule and can
    # still surface urgent fixes.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # React is on an exact version (package.json). It was held at 18.2.0 for
      # react-native 0.73, which is no longer a dependency; moving it stays a
      # planned change with a full test run, not part of a grouped bump.
      - dependency-name: "react"
        update-types:
          - version-update:semver-minor
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      non-major-worker-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # wrangler is pinned exactly in worker/scripts/lib.sh as well as package.json;
    # a major bump of the deploy tool or the Workers test pool needs a planned
    # change with a real deploy rehearsal, not an automatic grouped PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      non-major-server-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
