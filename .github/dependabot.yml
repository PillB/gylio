version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      non-major-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major version updates in this mixed web/server/mobile package graph need
    # explicit compatibility work. Dependabot security updates are not disabled
    # by this version-update rule and can still surface urgent fixes.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # react-native is 0.x, so its "minor" releases are breaking (0.87 needs
      # React 19). React stays on the exact version react-native 0.73 peers on.
      # Upgrade these three together as a planned migration, not a grouped bump.
      - dependency-name: "react-native"
        update-types:
          - version-update:semver-minor
      - dependency-name: "react"
        update-types:
          - version-update:semver-minor
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      non-major-worker-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # wrangler is pinned exactly in worker/scripts/lib.sh as well as package.json;
    # a major bump of the deploy tool or the Workers test pool needs a planned
    # change with a real deploy rehearsal, not an automatic grouped PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      non-major-server-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
