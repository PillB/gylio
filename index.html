<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="__GYLIO_CSP__">
    <meta charset="UTF-8" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Viewport: viewport-fit=cover for notch/Dynamic Island. interactive-widget=resizes-content makes Chrome and
         Firefox on Android shrink the page above the keyboard, so viewport-sized dialogs keep their buttons in reach;
         Safari ignores the key and logs a notice (accepted in e2e/helpers/browserNotices.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GYLIO" />
    <!-- Android Chrome theme color -->
    <meta name="theme-color" content="#5B5CF6" />
    <!-- Prevent auto-linking of phone/email on iOS/Android -->
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <title>GYLIO – Get Your Life In Order</title>
    <!-- Inter is bundled with the app (src/styles/fonts.css), so it works offline; reading preferences are in Settings. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Prevent horizontal scroll on mobile */
        overflow-x: hidden;
        /* Prevent pull-to-refresh rubberbanding on the root */
        overscroll-behavior-y: none;
        /* Force light mode — GYLIO is a light-theme app; dark-mode OS overrides break the palette */
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #F8F7F4;
        color: #1C1B22;
        min-height: 100dvh;
        line-height: 1.6;
        overflow-x: hidden;
      }
      button { font-family: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 2px solid #5B5CF6; outline-offset: 2px; }
      /* Minimum 16px on all inputs to prevent iOS Safari auto-zoom on focus.
         !important needed to override Clerk's component stylesheet. */
      input, textarea, select { font-family: inherit; font-size: max(16px, 1rem) !important; }
      /* Primary navigation must wrap (WCAG 2.2 SC 1.4.10 Reflow: no horizontal
         scrolling to reach a destination), but seven wrapped destinations cost
         ~198px at 320px — 35% of the viewport before any content. Tighten the
         items on narrow screens so they occupy fewer rows while keeping the
         44px touch target. !important is required because the component styles
         these elements inline. */
      @media (max-width: 430px) {
        .app-nav { gap: 3px !important; padding: 3px !important; }
        .app-nav__item {
          padding-left: 7px !important;
          padding-right: 7px !important;
          font-size: 0.75rem !important;
          gap: 3px !important;
        }
        /* Same treatment for the in-page view tabs, which stack a second
           multi-row control strip directly beneath the primary navigation. */
        .app-tabs { gap: 4px !important; }
        .app-tabs__item {
          padding-left: 9px !important;
          padding-right: 9px !important;
          font-size: 0.8125rem !important;
        }
      }
      /* The tour's "← → navigate · Esc pause" line is for a keyboard: hidden on touch-only devices. */
      @media (hover: none) and (pointer: coarse) {
        .tour-keyboard-hint { display: none; }
      }
      /* Safari ignores list-style on <summary>; keep the native marker from doubling a custom chevron. */
      summary::-webkit-details-marker { display: none; }
      .legal-footer {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 4px 0 max(8px, env(safe-area-inset-bottom));
        border-top: 1px solid #D9D7D0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px 18px;
        flex-wrap: wrap;
        font-size: 0.8125rem;
      }
      .legal-footer a {
        color: #4F46E5;
        font-weight: 600;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 8px;
        text-underline-offset: 3px;
      }
      .legal-table-wrap { overflow-x: auto; margin: 0 0 1em; }
      .legal-table-wrap th, .legal-table-wrap td { text-align: start; vertical-align: top; padding: 6px 10px; border: 1px solid #D9D7D0; }
      /* Motion setting. The app writes it on <html> (src/core/accessibility/motion.ts); !important because
         components set their transitions inline. "reduced": fades stay, nothing changes size or position
         gradually. "off": no transitions. Until the app has written it, the device's preference stands in.
         The page itself scrolls smoothly only in "full". */
      html[data-motion="full"] { scroll-behavior: smooth; }
      html[data-motion="reduced"] *, html[data-motion="reduced"] *::before, html[data-motion="reduced"] *::after {
        transition-property: color, background-color, border-color, outline-color, opacity, box-shadow !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
      @media (prefers-reduced-motion: reduce) {
        html:not([data-motion]) *, html:not([data-motion]) *::before, html:not([data-motion]) *::after {
          transition-property: color, background-color, border-color, outline-color, opacity, box-shadow !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
      /* iOS momentum scrolling for any overflow container */
      [data-scroll] {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Ensure all scrollable main content areas get momentum scrolling */
      main, [role="main"], .app-container {
        -webkit-overflow-scrolling: touch;
      }
      /* Mobile header: hide clock + TTS button to keep header in 1–2 rows on small screens.
         Time is visible in the system status bar; TTS is accessible from Settings. */
      @media (max-width: 520px) {
        .header-dt { display: none !important; }
        .header-tts { display: none !important; }
        /* Subscription badge hidden on mobile — status accessible from Settings */
        .header-subscription { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite will inject the compiled JavaScript here -->
    <script type="module" src="%BASE_URL%main.jsx"></script>
  </body>
</html>
